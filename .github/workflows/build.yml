name: Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

env:
  OPENSSL_FIPS_BRANCH: kryoptic_ossl401
  OPENSSL_STATIC_BRANCH: master

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        name: [standard, i686, minimal, pqc, no_sha1]
        linking: [dynamic, static, fips, openssl-sys]
        build: [debug, release]
        db: [sqlitedb, nssdb]
        exclude:
          - name: no_sha1 # nssdb doesn't work with no_sha1
            db: nssdb
          - name: minimal
            linking: fips
          - name: pqc # only works with openssl 3.5.0 so exclude dynamic
            linking: dynamic
          - name: pqc # already part of normal fips tests
            linking: fips
          - name: no_sha1 # already tested in fips and dynamic build
            linking: static
          - name: no_sha1
            linking: fips
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Get Date for DNF cache entry
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%V")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore DNF cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/libdnf5
          key: ${{ runner.os }}-dnf-${{ steps.get-date.outputs.date }}

      - name: Install Dependencies
        run: |
          dnf -y install git cargo clang-devel openssl openssl-devel \
            'perl(FindBin)' 'perl(lib)' 'perl(File::Compare)' \
            'perl(File::Copy)' 'perl(bigint)' 'perl(Time::HiRes)' \
            'perl(IPC::Cmd)' 'perl(Pod::Html)' 'perl(Digest::SHA)' \
            'perl(Module::Load::Conditional)' 'perl(File::Temp)' \
            'perl(Test::Harness)' 'perl(Test::More)' 'perl(Math::BigInt)' \
            'perl(Time::Piece)' zlib-devel sed sqlite-devel
          if [ "${{ matrix.name }}" = "i686" ]; then
            dnf -y install rust-std-static.i686 openssl-devel.i686 \
              sqlite-devel.i686
            if [ "${{ matrix.linking }}" != "dynamic" ]; then
              dnf -y install libatomic.i686
            fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup OpenSSL (fips)
        if: ${{ matrix.linking == 'fips' }}
        id: ossl-setup-fips
        run: |
          git config --global --add safe.directory /__w/kryoptic
          cd ..
          git clone https://github.com/simo5/openssl.git \
                    --single-branch --branch $OPENSSL_FIPS_BRANCH openssl
          cd openssl
          echo "KRYOPTIC_OPENSSL_SOURCES=$PWD" >> "$GITHUB_ENV"
          OS=${{ runner.os }}
          if [ "${{ matrix.name }}" = "i686" ]; then
              OS="${OS}-i686"
          fi
          echo "cacheid=${OS}-ossl-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup OpenSSL (static)
        if: ${{ matrix.linking == 'static' }}
        id: ossl-setup-static
        run: |
          git config --global --add safe.directory /__w/kryoptic
          cd ..
          git clone https://github.com/openssl/openssl.git \
                    --single-branch --branch $OPENSSL_STATIC_BRANCH openssl
          cd openssl
          echo "KRYOPTIC_OPENSSL_SOURCES=$PWD" >> "$GITHUB_ENV"
          OS=${{ runner.os }}
          if [ "${{ matrix.name }}" = "i686" ]; then
              OS="${OS}-i686"
          fi
          echo "cacheid=${OS}-ossl-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenSSL build (fips)
        if: ${{ matrix.linking == 'fips' }}
        uses: actions/cache/restore@v4
        id: cache-fips
        with:
          path: ${{ env.KRYOPTIC_OPENSSL_SOURCES }}
          key: ${{ steps.ossl-setup-fips.outputs.cacheid }}

      - name: Restore OpenSSL build (static)
        if: ${{ matrix.linking == 'static' }}
        uses: actions/cache/restore@v4
        id: cache-static
        with:
          path: ${{ env.KRYOPTIC_OPENSSL_SOURCES }}
          key: ${{ steps.ossl-setup-static.outputs.cacheid }}

      - name: Generate lock file
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build & test
        run: |
          export KRYOPTIC_TESTS_DEFAULT_DB="${{ matrix.db }}"
          FEATURES="${{ matrix.db }}"
          OPTS="--no-default-features"
          FEATURE_SET="standard"
          export CC=clang

          TEST_PKCS11_MODULE="${PWD}/target"

          if [ "${{ matrix.name }}" = "i686" ]; then
            # pkg-config expects a sysroot dir when cross-compiling; we have
            # the i686 development files in the same paths because this is an
            # x86_64 build machine
            export PKG_CONFIG_SYSROOT_DIR=/
            OPTS="${OPTS} --target i686-unknown-linux-gnu"
            TEST_PKCS11_MODULE="${TEST_PKCS11_MODULE}/i686-unknown-linux-gnu"
          elif [ "${{ matrix.name }}" = "minimal" ]; then
            FEATURE_SET="minimal"
          elif [ "${{ matrix.name }}" = "pqc" ]; then
            FEATURES="${FEATURES},pqc,slow"
          elif [ "${{ matrix.name }}" = "no_sha1" ]; then
            FEATURES="${FEATURES},no_sha1"
          fi

          if [ "${{ matrix.linking }}" = "dynamic" ]; then
            FEATURES="${FEATURES},${FEATURE_SET},dynamic"
          elif [ "${{ matrix.linking }}" = "static" ]; then
            FEATURES="${FEATURES},${FEATURE_SET},ossl-sys,ossl400"
          elif [ "${{ matrix.linking }}" = "fips" ]; then
            # fips no longer implies a backend, so name one explicitly.
            # Deliberately not ${FEATURE_SET}: standard would also pull in
            # hotp/chacha20/ike, widening what the fips leg tests.
            FEATURES="${FEATURES},fips,ossl-backend"
          elif [ "${{ matrix.linking }}" = "openssl-sys" ]; then
            FEATURES="${FEATURES},${FEATURE_SET},openssl-sys"
          fi

          if [ "${{ matrix.build }}" = "release" ]; then
            OPTS="${OPTS} --release"
            TEST_PKCS11_MODULE="${TEST_PKCS11_MODULE}/release"
          else
            TEST_PKCS11_MODULE="${TEST_PKCS11_MODULE}/debug"
          fi

          TEST_PKCS11_MODULE="${TEST_PKCS11_MODULE}/libkryoptic_pkcs11.so"

          # create a bogus configuration file to make sure it is not used during tests
          mkdir -p ~/.config/kryoptic/
          cp testdata/test.conf ~/.config/kryoptic/token.conf

          #BUILD
          cargo build -vv $OPTS --features "$FEATURES"

          # cargo test does not build libkryoptic_pkcs11.so and we need to make
          # it fips compatible in any case
          if [ "${{ matrix.linking }}" = "fips" ]; then
            ./misc/hmacify.sh "${TEST_PKCS11_MODULE}"
          fi
          export TEST_PKCS11_MODULE

          #TEST
          cargo test -vv $OPTS --features "$FEATURES"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build logs ${{ matrix.name }}-${{ matrix.linking }}-${{ matrix.build }}-${{ matrix.db }}
          path: |
            target/debug/build/*/output

      - name: Show Build configs and logs on error
        if: failure()
        run: |
          if [ "${{ matrix.linking }}" = "fips" ] || [ "${{ matrix.linking }}" = "static" ]; then
            cd ../openssl
            perl configdata.pm --dump
          fi

      - if: ${{ matrix.linking == 'fips' && steps.cache-fips.outputs.cache-hit != 'true' }}
        name: Cache OpenSSL FIPS build
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KRYOPTIC_OPENSSL_SOURCES }}
          key: ${{ steps.ossl-setup-fips.outputs.cacheid }}

      - if: ${{ matrix.linking == 'static' && steps.cache-static.outputs.cache-hit != 'true' }}
        name: Cache OpenSSL STATIC build
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KRYOPTIC_OPENSSL_SOURCES }}
          key: ${{ steps.ossl-setup-static.outputs.cacheid }}

      - if: ${{ matrix.name == 'i686' && steps.cache-static.outputs.cache-hit != 'true' }}
        name: Store DNF cache -- the i686 has the most dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/libdnf5
          key: ${{ runner.os }}-dnf-${{ steps.get-date.outputs.date }}

  build-awslc:
    name: Build (awslc)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend: [awslc, awslc-fips]
        name: [standard, i686, minimal, pqc, no_sha1]
        build: [debug, release]
        db: [sqlitedb, nssdb]
        exclude:
          # aws-lc-fips-sys's CMake build cannot cross-compile for i686: its
          # FIPS module-verification step ("bcm.o") mixes 32-bit and 64-bit
          # object files and fails to link ("relocatable linking with
          # relocations from format elf32-i386 ... to format elf64-x86-64
          # is not supported"). Plain aws-lc-sys (awslc, non-fips) has no
          # such step and cross-compiles for i686 without issue -- verified
          # directly against both crates in this same container image.
          - backend: awslc-fips
            name: i686
          # Selecting the awslc-fips feature unconditionally implies fips,
          # which unconditionally implies the same broad
          # ecc_all,ffdh,hash_all,kdf_all,rsa,pqc feature set "standard"
          # already requests here (Cargo's feature union has no way to turn
          # a feature back off) -- so "minimal" and "pqc" are redundant
          # with "standard" for this backend specifically. This exactly
          # mirrors why the ossl build job above already excludes
          # name:minimal/linking:fips and name:pqc/linking:fips for the
          # identical underlying reason.
          - backend: awslc-fips
            name: minimal
          - backend: awslc-fips
            name: pqc
          - name: no_sha1 # nssdb doesn't work with no_sha1
            db: nssdb
    container: quay.io/fedora/fedora:latest
    steps:
      - name: Get Date for DNF cache entry
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%V")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore DNF cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/libdnf5
          key: ${{ runner.os }}-dnf-awslc-${{ steps.get-date.outputs.date }}

      - name: Install Dependencies
        run: |
          dnf -y install git cargo clang-devel golang cmake perl-interpreter \
            zlib-devel sed sqlite-devel
          if [ "${{ matrix.name }}" = "i686" ]; then
            dnf -y install rust-std-static.i686 glibc-devel.i686 \
              sqlite-devel.i686 libatomic.i686
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate lock file
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-awslc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build & test
        run: |
          export KRYOPTIC_TESTS_DEFAULT_DB="${{ matrix.db }}"
          # awslc has no equivalent of ossl-backend's own "standard"/
          # "minimal" Cargo features: both of those hard-code
          # `ossl-backend` in their own definition, so they can't be reused
          # for this backend. This is the closest match to "standard" that
          # actually compiles under awslc: chacha20 is deliberately left
          # out (it has no awslc-side implementation at all -- a real,
          # confirmed gap, unlike hotp/ike which do compile here).
          FEATURES="${{ matrix.backend }},${{ matrix.db }},ecc_all,ffdh,hash_all,kdf_all,rsa,hotp,ike"
          OPTS="--no-default-features"

          if [ "${{ matrix.name }}" = "i686" ]; then
            export PKG_CONFIG_SYSROOT_DIR=/
            export CC_i686_unknown_linux_gnu=gcc
            export CFLAGS_i686_unknown_linux_gnu=-m32
            OPTS="${OPTS} --target i686-unknown-linux-gnu"
          elif [ "${{ matrix.name }}" = "minimal" ]; then
            FEATURES="${{ matrix.backend }},${{ matrix.db }},aes,ecc_min,hash_all,rsa"
          elif [ "${{ matrix.name }}" = "pqc" ]; then
            FEATURES="${FEATURES},pqc,slow"
          elif [ "${{ matrix.name }}" = "no_sha1" ]; then
            FEATURES="${FEATURES},no_sha1"
          fi

          if [ "${{ matrix.build }}" = "release" ]; then
            OPTS="${OPTS} --release"
          fi

          # Scoped to -p kryoptic-lib: this container has no OpenSSL dev
          # headers installed (it only needs AWS-LC's build deps), so a
          # bare `cargo build` would also try to build the `ossl`
          # workspace member and fail with "No OpenSSL version detected".
          cargo build -vv -p kryoptic-lib $OPTS --features "$FEATURES"
          # --test-threads=1: the test harness's global C_Initialize/
          # C_Finalize singleton (src/tests/mod.rs's FINI/SYNC/INIT
          # coordination) is shared process-wide; a panic mid-test while
          # holding its lock can poison it for every other test in the
          # binary under default parallel scheduling.
          cargo test -vv -p kryoptic-lib $OPTS --features "$FEATURES" -- --test-threads=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build logs awslc-${{ matrix.backend }}-${{ matrix.name }}-${{ matrix.build }}-${{ matrix.db }}
          path: |
            target/debug/build/*/output
            target/release/build/*/output
